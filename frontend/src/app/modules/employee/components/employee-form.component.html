<!--
  Employee Form — demonstrates global uppercase directive usage.

  Fields WITH appUppercase → text auto-converts to UPPERCASE.
  Fields WITHOUT appUppercase (email, username, password) → left as-is.
-->

<form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">
  <h2>Employee Information</h2>

  <!-- ========== UPPERCASE FIELDS ========== -->
  <div class="form-group">
    <label for="employeeName">Employee Name</label>
    <input id="employeeName" formControlName="employeeName" appUppercase
           placeholder="Enter employee name" />
  </div>

  <div class="form-group">
    <label for="fatherName">Father's Name</label>
    <input id="fatherName" formControlName="fatherName" appUppercase
           placeholder="Enter father's name" />
  </div>

  <div class="form-group">
    <label for="motherName">Mother's Name</label>
    <input id="motherName" formControlName="motherName" appUppercase
           placeholder="Enter mother's name" />
  </div>

  <div class="form-group">
    <label for="department">Department</label>
    <input id="department" formControlName="department" appUppercase
           placeholder="Enter department" />
  </div>

  <div class="form-group">
    <label for="designation">Designation</label>
    <input id="designation" formControlName="designation" appUppercase
           placeholder="Enter designation" />
  </div>

  <div class="form-group">
    <label for="address">Address</label>
    <textarea id="address" formControlName="address" appUppercase
              placeholder="Enter address"></textarea>
  </div>

  <div class="form-group">
    <label for="city">City</label>
    <input id="city" formControlName="city" appUppercase
           placeholder="Enter city" />
  </div>

  <div class="form-group">
    <label for="state">State</label>
    <input id="state" formControlName="state" appUppercase
           placeholder="Enter state" />
  </div>

  <div class="form-group">
    <label for="country">Country</label>
    <input id="country" formControlName="country" appUppercase
           placeholder="Enter country" />
  </div>

  <!-- ========== EXCEPTION FIELDS (no appUppercase) ========== -->
  <h2>Account Details</h2>

  <div class="form-group">
    <label for="email">Email Address</label>
    <input id="email" type="email" formControlName="email"
           placeholder="user@example.com" />
  </div>

  <div class="form-group">
    <label for="username">Username</label>
    <input id="username" formControlName="username"
           placeholder="Enter username" />
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password"
           placeholder="Enter password" />
  </div>

  <button type="submit" [disabled]="employeeForm.invalid">Save Employee</button>
</form>
